[project]
name = "pensimpy"
version = "0.1.0"
description = "PenSimPy, the Python port of the IndPenSim penicillin fermentation simulator, as modified for this study"
requires-python = ">=3.12"
dependencies = [
    "tqdm>=4.67.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scipy>=1.16.3",
    "gymnasium>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pensimpy"
module-root = ""
